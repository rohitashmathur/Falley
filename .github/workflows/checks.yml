name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Gameplay, saves and audio
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Android preference interfaces
        run: |
          if (!$env:ANDROID_HOME -or !(Test-Path -LiteralPath (Join-Path $env:ANDROID_HOME 'platforms\android-35\android.jar'))) {
            throw 'The storage check requires the hosted runner Android API 35 interface jar.'
          }

      - name: Check gameplay, controls, progression and translations
        run: .\scripts\test-expansion.ps1 -JdkRoot "$env:JAVA_HOME"

      - name: Check durable avatar reward storage
        run: .\scripts\test-avatar-rewards.ps1 -JdkRoot "$env:JAVA_HOME" -SdkRoot "$env:ANDROID_HOME"

      - name: Check original music PCM and audio lifecycle
        run: python .\scripts\test_media.py --jdk-root "$env:JAVA_HOME"

      - name: Check input analysis export decoder
        run: python .\scripts\test_analytics_decoder.py
